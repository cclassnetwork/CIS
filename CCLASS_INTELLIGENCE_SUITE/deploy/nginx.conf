# nginx alternative to Caddy. Adjust server_name and certificate paths, then include from
# /etc/nginx/conf.d/. Run the app with:
#   CCLASS_HOST=127.0.0.1 CCLASS_ALLOWED_HOSTS=cclass.example.org \
#   CCLASS_COOKIE_SECURE=1 CCLASS_TRUST_PROXY=1 python3 cclass.py --dashboard
server {
    listen 80;
    server_name cclass.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cclass.example.org;

    ssl_certificate     /etc/letsencrypt/live/cclass.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cclass.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Overwrite (never append) so a client cannot forge its address:
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
